<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tiny 4-pointed star shape -->
    <path id="star-shape" d="M4 0 Q4 4 8 4 Q4 4 4 8 Q4 4 0 4 Q4 4 4 0 Z" fill="#ffffff" />
    
    <g id="sparkle-1">
      <use href="#star-shape" x="-4" y="-4" opacity="0.6" transform="scale(0.6)"/>
    </g>
    <g id="sparkle-2">
      <use href="#star-shape" x="-4" y="-4" opacity="0.4" transform="scale(0.8)"/>
    </g>
    <g id="sparkle-3">
      <use href="#star-shape" x="-4" y="-4" opacity="0.5" transform="scale(0.5)"/>
    </g>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Slightly increased amount of stars -->
  <use href="#sparkle-1" x="150" y="100" />
  <use href="#sparkle-2" x="600" y="250" />
  <use href="#sparkle-3" x="300" y="600" />
  <use href="#sparkle-1" x="750" y="700" />
  <use href="#sparkle-2" x="50" y="450" />
  
  <!-- Additional stars -->
  <use href="#sparkle-3" x="450" y="150" />
  <use href="#sparkle-1" x="200" y="350" />
  <use href="#sparkle-2" x="650" y="550" />
  <use href="#sparkle-3" x="100" y="750" />
</svg>
